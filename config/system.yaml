# Configuration HERBERT V0.1 — clé: valeur, un seul niveau d'imbrication.
# Parsé par app/config.py (parseur minimal stdlib, pas de dépendance PyYAML).

database:
  path: data/herbert.db

migrations:
  dir: migrations

logs:
  dir: logs

claude_headless:
  model: claude-sonnet-5
  max_iterations: 3
  timeout_seconds: 600
